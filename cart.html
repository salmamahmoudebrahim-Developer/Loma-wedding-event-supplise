<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loma - Shopping Cart</title>
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="images/images.jfif" alt="Loma Logo" class="logo-img">
            <span class="brand-name">Loma</span>
        </div>

        <div class="header-buttons">
            <a href="favorites.html" class="btn" id="favLink">
                <i class="fa-solid fa-heart"></i> Favorites (<span id="favCount">0</span>)
            </a>
            <a href="cart.html" class="btn" id="cartLink">
                <i class="fa-solid fa-cart-shopping"></i> Cart (<span id="cartCount">0</span>)
            </a>
            <a href="login.html" class="btn">Login</a>
            <a href="register.html" class="btn">Register</a>
        </div>
    </header>

    <!-- Cart Section -->
    <main style="max-width: 900px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
        <h2 style="margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;">Your Shopping Cart</h2>

        <div id="cartItems"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px; flex-wrap: wrap; gap: 15px;">
            <div style="font-size: 20px; font-weight: bold;">
                Total: <span id="cartTotal" style="color: #b8860b;">$0</span>
            </div>
            <div class="cart-actions">
                <button type="button" id="clearCartBtn" class="clear-btn">Clear Cart</button>
                <a href="index.html" class="continue-btn">Continue Shopping</a>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
