<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loma - Register</title>
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="images/images.jfif" alt="Roma Logo" class="logo-img">
            <span class="brand-name">Loma</span>
        </div>
        <div class="header-buttons">
            <a href="index.html" class="btn">Home</a>
        </div>
    </header>

    <div class="auth-container">
        <h2>Create Account</h2>
        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="First name" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Last name" required>
                </div>
            </div>
            <div class="form-group full">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group full">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="Create password" required>
            </div>
            <p id="registerMsg" style="display: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; margin-bottom: 12px; text-align: center;"></p>
            <button type="submit" class="auth-btn">Register</button>
        </form>
        <div class="auth-switch">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
